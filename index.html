<!DOCTYPE html>
<html lang="es">
<head>

<body>
  
  <div id="menu-screen" class="screen active">
    <div class="scene scene--16-9">
      <img src="Newsimgs/mainmenu.jpg" alt="Menú principal">
      <button id="comenzar" type="button"></button>

  </div>

  <div id="ingredientes-screen" class="screen">
    <div class="scene scene--ingredientes">
      <img src="Newsimgs/ingredientes.PNG" alt="Ingredientes">
      <svg class="ingredientes-overlay"
           viewBox="0 0 1536 1085.883692"
           preserveAspectRatio="xMidYMid meet">

        <!-- Vino Tinto -->
        <polygon
        class="ingrediente" data-nombre="Vino Tinto"
        points="411,100 479,179 479,207 463,352 390,364 370,371 329,361 289,359 279,267 270,220 288,175 300,145 337,115 337,57 351,26 376,25 389,22 415,47" />

        <!-- LICUADORA -->

        class="ingrediente" data-nombre="Licuadora"
        points="630,146 660,303 625,466 648,473 736,489 828,470 838,413 814,299 844,267 844,176 794,110 663,110" />

        <!-- AZÚCAR -->
        <polygon
        class="ingrediente" data-nombre="Azucar"
        points="1240,97 1170,92 1115,148 1118,300 1127,362 1261,413 1320,363 1305,184" />

        <!-- HIELOS -->
        <polygon
        class="ingrediente" data-nombre="Hielos"
        points="220,440 279,357 422,434 379,516" />

        <!-- VASO -->
        <polygon
        class="ingrediente" data-nombre="Vaso"
        points="897,265 917,460 961,465 1015,460 1023,266" />

        <!-- CUCHILLO -->
        <polygon
        class="ingrediente" data-nombre="Cuchillo" data-requerido="true"
        points="857,495 1076,572 1093,557 1000,485 856,442" />

        <!-- FRUTILLAS -->
        <polygon
        class="ingrediente" data-nombre="Frutillas" data-requerido="true"
        points="1285,427 1313,483 1292,560 1244,579 1139,566 1113,481 1149,431" />

        <!-- TABLA -->
        <polygon
        class="ingrediente" data-nombre="Tabla"
        points="424,469 558,600 661,524 507,376 450,359 419,375" />

      </svg>
    </div>
    <!-- Cartel que aparece al pasar el mouse -->
    <div id="tooltip-ingrediente"></div>
</div>

  <div id="licuar" class="screen">
    <div class="scene scene--16-9">
      <img id="licuar-frame" src="Newsimgs/Lic1.jpg.jpeg" alt="Proceso de licuado">
      <button id="licuar-boton" type="button" data-target="after-screen"></button>
    </div>
  </div>

      <div id="ingredientes-sinlic-screen" class="screen">
    <div class="scene scene--ingredientes">
      <img src="Newsimgs/e385eb83-067b-4e83-9354-f1d2c8038649.png" alt="Ingredientessinlic">
      <svg class="ingredientes-overlay"
           viewBox="0 0 1536 1085.883692"
           preserveAspectRatio="xMidYMid meet">

        <!-- AZÚCAR -->
        <polygon
        class="ingrediente" data-nombre="Azucar" data-target="azucarear"
        points="1240,97 1170,92 1115,148 1118,300 1127,362 1261,413 1320,363 1305,184" />

        <!-- HIELOS -->
        <polygon
        class="ingrediente" data-nombre="Hielos"

</div>

  <div id="azucarear" class="screen">
    <div class="scene scene--16-9">
      <img src="Newsimgs/cuchillo.PNG" alt="azucarear">
      <button id="azucarear-boton" type="button" data-target="menu-screen"></button>
    </div>
  </div>

    <div id="soloaguayvaso" class="screen">
    <div class="scene scene--16-9">
      <img src="Newsimgs/soloaguayvaso.png" alt="soloaguayvaso">
      <button id="soloaguayvaso-boton" type="button" data-target="menu-screen"></button>
    </div>
  </div>

  <div id="perdiste-screen" class="screen">
    <div class="scene scene--16-9">
      <img src="Newsimgs/PERDISTE.png" alt="Perdiste">
      <button id="perdiste-menu" type="button" data-target="menu-screen"></button>
    </div>
  </div>

  <button id="recipe-help" type="button" aria-label="Abrir receta" aria-haspopup="dialog">
    ?
  </button>

  <dialog id="difficulty-dialog" aria-labelledby="difficulty-dialog-title">
    <h2 id="difficulty-dialog-title">Elegir dificultad</h2>
    <div class="difficulty-options">
      <button type="button" data-difficulty="facil">Novato</button>
      <button type="button" data-difficulty="dificil">Pro</button>
    </div>
  </dialog>

  <dialog id="recipe-dialog" aria-labelledby="recipe-dialog-title">
    <h2 id="recipe-dialog-title">Receta del Vino con Frutilla</h2>
    <ol>
      <li>Cortar las frutillas</li>
      <li>Agregar las frutillas y el vino a la licuadora</li>
      <li>Agregar el azúcar</li>
      <li>Servir en un vaso y agregar hielos</li>
      <li>Disfrutar del vino con frutilla</li>
    </ol>
    <button id="recipe-dialog-close" type="button">Cerrar</button>
  </dialog>

  <dialog id="error-dialog" aria-labelledby="error-dialog-title">
    <h2 id="error-dialog-title">Ingrediente incorrecto</h2>
    <p id="error-dialog-message"></p>
    <button id="error-dialog-close" type="button">Continuar</button>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
